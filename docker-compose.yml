version: '3.8'

services:
  # PostgreSQL Veritabanı (Opsiyonel - SQLite yerine PostgreSQL tercih edenler için)
  postgres:
    image: postgres:15-alpine
    container_name: whatsapp_bot_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: bot_user
      POSTGRES_PASSWORD: bot_password_2026
      POSTGRES_DB: muhendislik_bot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
    driver: local
